<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东方快车探案 - AI对话与关系图</title>
    <!-- 引入在线字体（示例：思源黑体） -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入jQuery -->
    <script type="text/javascript" src="https://echarts.apache.org/zh/js/vendors/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- 引入ECharts -->
    <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 全局自定义字体 */
            font-family: 'Noto Sans SC', "Microsoft YaHei", sans-serif;
        }
        
        body {
            background: #f0f2f5;
            height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 25px 30px;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            text-align: center;
            flex-shrink: 0;
        }
        
        .header h2 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 15px;
        }
        
        /* 横向布局：对话左，关系图右 */
        .main-content {
            display: flex;
            flex-direction: row;
            flex: 1;
            overflow: hidden;
        }
        
        /* 对话区域 - 左 */
        .chat-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            min-width: 300px;
            height: 100%;
            border-right: 2px solid #e0e0e0;
        }
        
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: white;
        }
        
        .message {
            margin: 12px 0;
            padding: 14px 18px;
            border-radius: 10px;
            line-height: 1.6;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-msg {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.2);
        }
        
        .ai-msg {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            color: #1b5e20;
            border: 1px solid #a5d6a7;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.1);
        }
        
        .loading {
            display: inline-flex;
            align-items: center;
            color: #666;
            font-style: italic;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            background: #2196f3;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        .input-area {
            padding: 20px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        
        input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        
        input:focus {
            outline: none;
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }
        
        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        
        button:hover {
            background: linear-gradient(135deg, #1976d2, #1565c0);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status {
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: #666;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        /* 响应式调整 */
        @media (max-width: 1000px) {
            .main-content {
                flex-direction: column;
            }
            .chat-section {
                border-right: none;
                border-bottom: 2px solid #e0e0e0;
                min-width: auto;
                min-height: 250px;
            }
            .graph-section {
                min-height: 300px;
            }
        }
        
        /* 关系图区域 - 右 */
        .graph-section {
            flex: 3;
            min-width: 400px;
            height: 100%;
            position: relative;
            background: #fafafa;
        }
        
        #graph-container {
            width: 100%;
            height: 100%;
        }
        
        /* 图例样式 */
        .graph-legend {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            font-size: 12px;
            z-index: 10;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        /* 事件图例改为菱形 */
        .legend-item:nth-child(2) .legend-color {
            border-radius: 0;
            transform: rotate(45deg);
            background: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🚂 东方快车探案 - AI对话与关系图</h2>
            <p>自定义节点形状+字体 | 人物圆形，事件菱形</p>
        </div>
        
        <div class="main-content">
            <div class="chat-section">
                <div id="chat-box" class="chat-box">
                    <div class="message ai-msg">
                        Ah, bonjour! 我是赫尔克里·波洛侦探，正在调查东方快车上的离奇命案。我的"灰色脑细胞"已经活跃起来了，你想了解什么，mon ami？
                    </div>
                </div>
                
                <div class="input-area">
                    <input id="user-input" placeholder="向波洛侦探提问..." autocomplete="off">
                    <button id="send-btn">发送</button>
                    <button id="download-btn">保存当前副本</button>
                </div>
            </div>

            <div class="graph-section">
                <div id="graph-container"></div>
                <div class="graph-legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e74c3c;"></div>
                        <span>人物</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #3498db;"></div>
                        <span>事件</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="status" class="status">就绪 - 等待加载原始JSON文件</div>
    </div>

    <script>
        const API_KEY = 'app-Yvdf9uBlW6VQChriK838JPcA';
        const API_URL = 'https://api.dify.ai/v1/chat-messages';
        const ORIGINAL_JSON_PATH = './case-data.json';
        
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const downloadBtn = document.getElementById('download-btn');
        const status = document.getElementById('status');
        
        let myChart = null;
        let originalGraphData = {};
        let graphDataCopy = {};
        let nodeIdCounter = 0;
        
        function loadOriginalAndCreateCopy() {
            return new Promise((resolve, reject) => {
                updateStatus('正在读取原始文件 case-data.json...');
                $.getJSON(ORIGINAL_JSON_PATH, function (originalData) {
                    originalGraphData = JSON.parse(JSON.stringify(originalData));
                    graphDataCopy = JSON.parse(JSON.stringify(originalData));
                    
                    if (graphDataCopy.nodes && graphDataCopy.nodes.length > 0) {
                        nodeIdCounter = Math.max(...graphDataCopy.nodes.map(n => n.id)) + 1;
                    }
                    
                    updateStatus(`✅ 已创建原始文件副本 | 初始节点数：${graphDataCopy.nodes.length}`);
                    resolve(graphDataCopy);
                }).fail(function (err) {
                    console.error('原始JSON读取失败:', err);
                    updateStatus('❌ 原始文件读取失败，请检查case-data.json是否存在');
                    reject(err);
                });
            });
        }
        
        /* 核心修改：初始化图表时设置不同节点形状 */
        function initGraphWithCopy() {
            const chartDom = document.getElementById('graph-container');
            myChart = echarts.init(chartDom);
            
            const option = {
                title: {
                    text: '案件关系图（人物圆形，事件菱形）',
                    left: 'center',
                    top: 10,
                    textStyle: { 
                        fontSize: 18, 
                        fontWeight: 'bold',
                        fontFamily: 'Noto Sans SC' // 标题自定义字体
                    }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (params.dataType === 'node') {
                            return `<b>${params.data.name}</b><br/>类型: ${graphDataCopy.categories[params.data.category].name}`;
                        } else if (params.dataType === 'edge') {
                            const source = graphDataCopy.nodes.find(n => n.id === params.data.source);
                            const target = graphDataCopy.nodes.find(n => n.id === params.data.target);
                            return `<b>关系连接</b><br/>${source?.name} → ${target?.name}`;
                        }
                    }
                },
                legend: { 
                    show: true, 
                    top: 40, 
                    data: graphDataCopy.categories.map(cat => cat.name),
                    textStyle: { fontFamily: 'Noto Sans SC' } // 图例自定义字体
                },
                animationDuration: 1500,
                animationEasingUpdate: 'quinticInOut',
                series: [{
                    name: '案件关系',
                    type: 'graph',
                    layout: 'force',
                    data: graphDataCopy.nodes,
                    links: graphDataCopy.links,
                    categories: graphDataCopy.categories,
                    roam: true,
                    draggable: true,
                    // 关键：按分类设置节点形状和大小
                    symbol: function(params) {
                        // params.data.category 0=人物，1=事件
                        return params.data.category === 0 ? 'circle' : 'diamond';
                    },
                    symbolSize: function(params) {
                        // 按分类设置大小，可自定义
                        return params.data.category === 0 ? 30 : 25;
                    },
                    label: { 
                        show: true, 
                        position: 'right', 
                        formatter: '{b}', 
                        fontSize: 12,
                        fontFamily: 'Noto Sans SC' // 节点文字自定义字体
                    },
                    lineStyle: { color: 'source', curveness: 0.1, width: 2 },
                    emphasis: { focus: 'adjacency', lineStyle: { width: 4 } },
                    force: { repulsion: 250, edgeLength: 120, gravity: 0.05, layoutAnimation: true }
                }]
            };
            
            myChart.setOption(option);
            myChart.setOption({
                series: [{ zoom: 3, center: [myChart.getWidth() / 2, myChart.getHeight() / 2] }]
            });
            
            window.addEventListener('resize', () => myChart.resize());
        }

        function SplitAIResponse(responseText) {
            const parts = responseText.split('===DATA===');
            return parts;
        }
        
        function parseAndUpdateCopy(jsonStr) {
            let newData;
            try {
                newData = JSON.parse(jsonStr);
            } catch (e) {
                updateStatus('❌ AI回复中的JSON格式错误');
                console.error('JSON解析失败:', e);
                return;
            }
            
            if (newData.nodes) {
                newData.nodes.forEach(newNode => {
                    const exists = graphDataCopy.nodes.some(n => n.name === newNode.name);
                    if (!exists) {
                        newNode.id = nodeIdCounter++;
                        graphDataCopy.nodes.push(newNode);
                    }
                });
            }
            
            if (newData.links) {
                graphDataCopy.links.push(...newData.links);
            }
            
            // 新增节点后，重新渲染时会自动应用形状规则
            myChart.setOption({
                series: [{ data: graphDataCopy.nodes, links: graphDataCopy.links }]
            });
            
            updateStatus(`✅ 副本已更新 | 当前节点数：${graphDataCopy.nodes.length}`);
        }
        
        function downloadCopyAsNewFile() {
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `case-data-copy-${timestamp}.json`;
            const copyJsonStr = JSON.stringify(graphDataCopy, null, 2);
            const blob = new Blob([copyJsonStr], { type: 'application/json' });
            
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
            updateStatus(`✅ 副本已导出为：${fileName}`);
        }
        
        function addMessage(text, type = 'ai') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type === 'user' ? 'user-msg' : 'ai-msg'}`;
            if (text === 'thinking') {
                msgDiv.innerHTML = `<div class="loading">波洛思考中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
            } else {
                msgDiv.textContent = text;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        function updateStatus(text) {
            status.textContent = text;
        }
        
        async function callDifyAPI(userMessage) {
            try {
                addMessage('thinking', 'ai');
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        query: userMessage,
                        response_mode: "blocking",
                        conversation_id: "",
                        user: "detective_game_" + Date.now(),
                        inputs: {}
                    })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                const thinkingMsg = chatBox.querySelector('.loading');
                if (thinkingMsg) thinkingMsg.parentElement.remove();
                
                if (data.answer) {
                    const parts = SplitAIResponse(data.answer);
                    addMessage(parts[0].trim(), 'ai');
                    parseAndUpdateCopy(parts[1].trim());
                    return data.answer;
                } else {
                    throw new Error('API返回无答案');
                }
            } catch (error) {
                console.error('API错误:', error);
                const thinkingMsg = chatBox.querySelector('.loading');
                if (thinkingMsg) thinkingMsg.parentElement.remove();
                addMessage(`抱歉，出错了: ${error.message}`, 'ai');
                updateStatus(`❌ API错误: ${error.message}`);
                return null;
            }
        }
        
        async function handleSendMessage() {
            const message = userInput.value.trim();
            if (!message) { alert('请输入问题'); return; }
            
            sendBtn.disabled = true;
            userInput.disabled = true;
            addMessage(message, 'user');
            userInput.value = '';
            
            updateStatus('正在向波洛侦探提问...');
            await callDifyAPI(message);
            
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }
        
        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSendMessage(); });
        downloadBtn.addEventListener('click', downloadCopyAsNewFile);
        
        window.onload = async () => {
            try {
                await loadOriginalAndCreateCopy();
                initGraphWithCopy();
                userInput.focus();
                updateStatus('✅ 系统就绪 | 人物圆形，事件菱形，支持自定义字体');
            } catch (err) {
                console.error('初始化失败:', err);
            }
        };
    </script>
</body>
</html>
