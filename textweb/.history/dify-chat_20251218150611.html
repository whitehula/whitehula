<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东方快车探案 - AI对话与关系图</title>
    <script type="text/javascript" src="https://echarts.apache.org/zh/js/vendors/jquery@3.7.1/dist/jquery.min.js"></script>
    <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
            /* 定义本地字体 */
    @font-face {
    /* 自定义字体名称（后续 ECharts 中要用到） */
    font-family: 'MyPingFang';  
    /* 本地字体文件路径（相对/绝对路径均可） */
    src: url('./YanShiYouRanXiaoKai-2.ttf') format('truetype');
    /* 可选：字体权重/样式 */
    font-weight: normal;
    font-style: normal;
    /* 可选：禁止浏览器跨域限制（如需） */
    font-display: swap;
    }

    /* 全局生效（可选，让页面默认用该字体） */
    body {
    font-family: 'MyPingFang', sans-serif;
    }
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
             font-family: 'MyPingFang', sans-serif !important;
        }
        
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: rgba(255, 255, 255, 0.71);
            height: 100vh;
            padding: 20px;
        }
        body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('black.png'); /* 替换为你的图片URL */
        background-size: cover;
        background-position: center;
        z-index: -1;
    }
            
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 25px 30px;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            text-align: center;
            flex-shrink: 0;
        }
        
        .header h2 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 15px;
        }
        
        .main-content {
            display: flex;
            flex-direction: row;
            flex: 1; 
            overflow: hidden;
        }
        
        .graph-section {
            flex: 5;
            min-height: 300px;
            position: relative;
            border-bottom: 2px solid #e0e0e0;
            background: #ffffff;
        }
        
        #graph-container {
            width: 100%;
            height: 100%;
        }
        
        .chat-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            min-height: 250px;
        }
        
        .chat-box {
            flex: 2;
            padding: 20px;
            overflow-y: auto;
            background: rgb(255, 255, 255);
        }
        
        .message {
            margin: 12px 0;
            padding: 14px 18px;
            border-radius: 10px;
            line-height: 1.6;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-msg {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.2);
        }
        
        .ai-msg {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            color: #1b5e20;
            border: 1px solid #a5d6a7;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.1);
        }
        
        .loading {
            display: inline-flex;
            align-items: center;
            color: #666;
            font-style: italic;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            background: #2196f3;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        .input-area {
            padding: 20px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        
        input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        
        input:focus {
            outline: none;
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }
        
        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        
        button:hover {
            background: linear-gradient(135deg, #1976d2, #1565c0);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status {
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: #666;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        @media (max-height: 800px) {
            .graph-section { flex: 2; }
            .chat-section { flex: 1; }
        }
        
        @media (max-height: 600px) {
            .graph-section { min-height: 200px; }
            .chat-section { min-height: 200px; }
            .header { padding: 15px; }
        }
        
        /* 图例样式补充 */
        .graph-legend {
            position: absolute;
            top: 10px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🚂 东方快车探案 - AI对话与关系图</h2>
        </div>
        
        <div class="main-content">
            <div class="graph-section">
                <div id="graph-container"></div>
                <div class="graph-legend">
                    <div class="legend-item">
                        
                    </div>
                    <div class="legend-item">
                        
                    </div>
                </div>
            </div>
            
            <div class="chat-section">
                <div id="chat-box" class="chat-box">
                    <div class="message ai-msg">
                        亲爱的探员，感谢你不辞辛苦来到这里，你可以对目前发生的情况展开提问，一次只问1-2个问题更容易得到准确答案
                    </div>
                </div>
                
                <div class="input-area">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="向波洛侦探提问（例如：雷切特是怎么死的？）" 
                        autocomplete="off"
                    >
                    <button id="send-btn">发送</button>
                    <button id="download-btn">保存当前副本</button>
                </div>
            </div>
        </div>
        
        <div id="status" class="status">
            就绪 - 等待加载原始JSON文件
        </div>
    </div>

    <script>
        const API_KEY = 'app-Yvdf9uBlW6VQChriK838JPcA';
        const API_URL = 'https://api.dify.ai/v1/chat-messages';
        const ORIGINAL_JSON_PATH = './case-data.json';
        
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const downloadBtn = document.getElementById('download-btn');
        const status = document.getElementById('status');
        
        let myChart = null;
        let originalGraphData = {};
        let graphDataCopy = {};
        let nodeIdCounter = 0;
        // 新增：用于保存节点位置的缓存
        let nodePositionCache = {};

        // 步骤1：读取原始JSON，创建内存副本
        function loadOriginalAndCreateCopy() {
            return new Promise((resolve, reject) => {
                updateStatus('正在读取原始文件 case-data.json...');
                $.getJSON(ORIGINAL_JSON_PATH, function (originalData) {
                    originalGraphData = JSON.parse(JSON.stringify(originalData));
                    graphDataCopy = JSON.parse(JSON.stringify(originalData));

                    if (graphDataCopy.nodes && graphDataCopy.nodes.length > 0) {
                        graphDataCopy.nodes.forEach(node => {
                            if (node.category === 0) {
                                node.symbol = 'circle';
                                node.symbolSize = node.symbolSize || 25;
                            } else if (node.category === 1) {
                                node.symbol = 'diamond';
                                node.symbolSize = node.symbolSize || 18;
                            } else {
                                node.symbol = 'circle';
                                node.symbolSize = node.symbolSize || 20;
                            }
                        });
                        nodeIdCounter = Math.max(...graphDataCopy.nodes.map(n => n.id)) + 1;
                    }

                    updateStatus(`✅ 已创建原始文件副本 | 初始节点数：${graphDataCopy.nodes.length}`);
                    resolve(graphDataCopy);
                }).fail(function (err) {
                    console.error('原始JSON读取失败:', err);
                    updateStatus('❌ 原始文件读取失败，请检查case-data.json是否存在');
                    reject(err);
                });
            });
        }

        // 新增：保存当前所有节点的位置
        function saveNodePositions() {
            if (!myChart) return;
            const series = myChart.getOption().series[0];
            if (series && series.data) {
                series.data.forEach(node => {
                    if (node.x !== undefined && node.y !== undefined) {
                        nodePositionCache[node.id] = { x: node.x, y: node.y };
                    }
                });
            }
        }

        // 新增：恢复节点位置
        function restoreNodePositions(nodes) {
            nodes.forEach(node => {
                if (nodePositionCache[node.id]) {
                    node.x = nodePositionCache[node.id].x;
                    node.y = nodePositionCache[node.id].y;
                    // 强制固定位置，禁止力模拟修改
                    node.fx = node.x;
                    node.fy = node.y;
                }
            });
        }

        // 步骤2：初始化图表（基于内存副本）
        function initGraphWithCopy() {
            const chartDom = document.getElementById('graph-container');
            myChart = echarts.init(chartDom);
            
            const option = {
                title: {
                    text: '思维殿堂-案件关系图',
                    left: 'center',
                    top: 10,
                    textStyle: { fontSize: 18, fontWeight: 'bold',color:'#ffffff' }
                },
              tooltip: {
    trigger: 'item',
    backgroundColor: 'transparent',
    borderWidth: 0,
    padding: 0,
    formatter: function(params) {
        // 关键：获取节点的原始填充色（和ECharts默认配色一致）
        let nodeColor = params.color; // 直接获取节点的默认颜色
        let desc = params.data.desc || '暂无描述';
        
        if (params.dataType === 'node') {
            return `
                <div style="
                    background: ${nodeColor}; /* 使用节点默认色 */
                    border: 2px solid #fff; /* 白色描边 */
                    border-radius: 8px; 
                    padding: 10px 15px; 
                    color: #fff; 
                    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                ">
                    <b style="font-size: 14px;">${params.data.name}</b><br/>
                    <span style="font-size: 12px; opacity: 0.9;">${desc}</span>
                </div>
            `;
        } else if (params.dataType === 'edge') {
            const source = graphDataCopy.nodes.find(n => n.id === params.data.source);
            const target = graphDataCopy.nodes.find(n => n.id === params.data.target);
            return `
                <div style="
                    background: #666; 
                    border: 2px solid #fff; 
                    border-radius: 8px; 
                    padding: 8px 12px; 
                    color: #fff;
                ">
                    <b>${source?.name} → ${target?.name}</b><br/>
                    <span style="font-size: 11px;">${params.data.relation || '关联关系'}</span>
                </div>
            `;
        }
    }
},
                // 禁用全局动画，避免位置跳动
                animationDurationUpdate: 1000,
                animationEasingUpdate: 'quinticInOut',
                legend: { show: true, top: 40, data: graphDataCopy.categories.map(cat => cat.name) },
                series: [{
                    name: '案件关系',
                    type: 'graph',
                    layout: 'force',
                    data: graphDataCopy.nodes,
                    links: graphDataCopy.links,
                    categories: graphDataCopy.categories,
                    roam: true,
                    itemStyle: {
                        shadowBlur: 9,
                        shadowOffsetX: 1.5,
                        shadowOffsetY: 3,
                        shadowColor: '#555'
                    },
                    draggable: true,
                    label: {  color: rgb ,fontFamily: 'MyPingFang, sans-serif' ,show: true, position: 'inside', align: 'center', formatter: '{b}', fontSize: 12 },
                    itemStyle: {
                    borderColor: '#fff', // 描边色（白色）
                    borderWidth: 2, // 描边宽度（可调整，比如1/3）
                    shadowBlur: 9,
                    shadowOffsetX: 1.5,
                    shadowOffsetY: 3,
                    shadowColor: '#555'
                },
                // 可选：鼠标悬浮时的样式（强调态）
                emphasis: {
                    itemStyle: {
                        color: '#222', // 悬浮时填充色稍亮
                        borderColor: '#fff',
                        borderWidth: 3 // 悬浮时描边变粗
                    },
                    focus: 'adjacency', 
                    lineStyle: { width: 4 }
                },
                    force: {
                        repulsion: 800, // 增大斥力，避免节点聚集
                        edgeLength: 150, // 增大边长度，布局更松散
                        gravity: 0.01,   // 降低重力，减少向中心的拉力
                        layoutAnimation: false, // 关键：关闭布局动画
                        friction: 0.9    // 增加摩擦力，快速稳定
                    }
                }]
            };
            
            myChart.setOption(option);
            myChart.setOption({
                series: [{ zoom: 2, center: [myChart.getWidth() / 2, myChart.getHeight() / 2] }]
            });
            
            // 监听力模拟结束事件，保存初始位置
            myChart.on('forceEnd', function() {
                saveNodePositions();
                // 力模拟结束后，固定所有节点位置
                const nodes = myChart.getOption().series[0].data;
                restoreNodePositions(nodes);
                myChart.setOption({
                    series: [{ data: nodes }]
                });
            });
            
            window.addEventListener('resize', () => myChart.resize());
        }

        function SplitAIResponse(responseText) {
            const parts = responseText.split('===DATA===');
            return parts;
        }

        // 步骤3：从AI回复分割数据，修改内存副本
        function parseAndUpdateCopy(jsonStr) {
            let newData;
            try {
                newData = JSON.parse(jsonStr);
            } catch (e) {
                updateStatus('❌ AI回复中的JSON格式错误');
                console.error('JSON解析失败:', e);
                return;
            }
            
            // 1. 更新前先保存当前节点位置
            saveNodePositions();
            
            // 2. 处理新节点
            if (newData.nodes) {
                newData.nodes.forEach(newNode => {
                    const exists = graphDataCopy.nodes.some(n => n.name === newNode.name);
                    if (!exists) {
                        newNode.id = nodeIdCounter++;
                        if (newNode.category === 0) {
                            newNode.symbol = 'circle';
                            newNode.symbolSize = 25;
                        } else if (newNode.category === 1) {
                            newNode.symbol = 'diamond';
                            newNode.symbolSize = 18;
                        }
                        graphDataCopy.nodes.push(newNode);
                    }
                });
            }
            
            // 3. 处理新链接
            if (newData.links) {
                graphDataCopy.links.push(...newData.links);
            }
            
            // 4. 恢复原有节点的位置，并固定
            restoreNodePositions(graphDataCopy.nodes);
            
            // 5. 更新图表（无动画）
            myChart.setOption({
                animation: false,
                animationDurationUpdate: 0,
                series: [{ 
                    data: graphDataCopy.nodes, 
                    links: graphDataCopy.links,
                    force: {
                        layoutAnimation: false // 确保更新时也关闭布局动画
                    }
                }]
            });
            
            updateStatus(`✅ 副本已更新 | 当前节点数：${graphDataCopy.nodes.length}`);
        }

        // 步骤4：导出内存副本为新的JSON文件
        function downloadCopyAsNewFile() {
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `case-data-copy-${timestamp}.json`;
            const copyJsonStr = JSON.stringify(graphDataCopy, null, 2);
            const blob = new Blob([copyJsonStr], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
            updateStatus(`✅ 副本已导出为：${fileName}`);
        }

        function addMessage(text, type = 'ai') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type === 'user' ? 'user-msg' : 'ai-msg'}`;
            if (text === 'thinking') {
                msgDiv.innerHTML = `<div class="loading">波洛思考中<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
            } else {
                msgDiv.textContent = text;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updateStatus(text) {
            status.textContent = text;
        }

        async function callDifyAPI(userMessage) {
            try {
                addMessage('thinking', 'ai');
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        query: userMessage,
                        response_mode: "blocking",
                        conversation_id: "",
                        user: "detective_game_" + Date.now(),
                        inputs: {}
                    })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                const thinkingMsg = chatBox.querySelector('.loading');
                if (thinkingMsg) thinkingMsg.parentElement.remove();
                
                if (data.answer) {
                    const parts = SplitAIResponse(data.answer);
                    addMessage(parts[0].trim(), 'ai');
                    parseAndUpdateCopy(parts[1].trim());
                    return data.answer;
                } else {
                    throw new Error('API返回无答案');
                }
            } catch (error) {
                console.error('API错误:', error);
                const thinkingMsg = chatBox.querySelector('.loading');
                if (thinkingMsg) thinkingMsg.parentElement.remove();
                addMessage(`抱歉，出错了: ${error.message}`, 'ai');
                updateStatus(`❌ API错误: ${error.message}`);
                return null;
            }
        }

        async function handleSendMessage() {
            const message = userInput.value.trim();
            if (!message) { alert('请输入问题'); return; }
            
            sendBtn.disabled = true;
            userInput.disabled = true;
            addMessage(message, 'user');
            userInput.value = '';
            
            updateStatus('正在向波洛侦探提问...');
            await callDifyAPI(message);
            
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSendMessage(); });
        downloadBtn.addEventListener('click', downloadCopyAsNewFile);

        window.onload = async () => {
            try {
                await loadOriginalAndCreateCopy();
                initGraphWithCopy();
                userInput.focus();
                updateStatus('✅ 系统就绪 | 所有修改仅作用于内存副本，可点击「保存当前副本」导出');
            } catch (err) {
                console.error('初始化失败:', err);
            }
        };
    </script>
</body>
</html>
