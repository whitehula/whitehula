<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dify AI Chat</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #1890ff, #52c41a);
            color: white;
        }
        
        .chat-box {
            padding: 20px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .message {
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            max-width: 80%;
        }
        
        .user-msg {
            background: #1890ff;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }
        
        .ai-msg {
            background: #f6ffed;
            color: #333;
            border: 1px solid #b7eb8f;
            border-bottom-left-radius: 2px;
        }
        
        .loading {
            display: inline-flex;
            align-items: center;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            background: #1890ff;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        

        .animated-element {
        animation: slidein 3s ease-in-out;
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 10px;
        }
        
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 16px;
        }
        
        input:focus {
            outline: none;
            border-color: #1890ff;
        }
        
        button {
            padding: 12px 24px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        
        button:hover {
            background: #40a9ff;
        }
        
        button:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
        
        .status {
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Dify AI 对话测试</h2>
            <p>使用你的API Key进行对话测试</p>
        </div>
        
        <div id="chat-box" class="chat-box">
            <div class="message ai-msg">
                您好！我是Dify AI助手，请输入消息开始对话。
            </div>
        </div>
        
        <div class="input-area">
            <input 
                type="text" 
                id="user-input" 
                placeholder="输入消息..." 
                autocomplete="off"
            >
            <button id="send-btn">发送</button>
        </div>
        
        <div id="status" class="status">
            就绪
        </div>
    </div>

    <script>
        /* 

        配置Dify API
        
        */
        const API_KEY = 'app-Yvdf9uBlW6VQChriK838JPcA';
        const API_URL = 'https://api.dify.ai/v1/chat-messages';
        
        // DOM元素
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const status = document.getElementById('status');
        
        // 添加消息到聊天框
        function addMessage(text, type = 'ai') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            if (text === 'thinking') {
                msgDiv.innerHTML = `
                    <div class="loading">
                        思考中<span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                `;
            } else {
                msgDiv.textContent = text;
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // 更新状态
        function updateStatus(text) {
            status.textContent = text;
        }
        
        // 调用Dify API
        async function callDifyAPI(userMessage) {
            try {
                // 显示思考中
                addMessage('thinking', 'ai');
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        query: userMessage,
                        response_mode: "blocking",
                        conversation_id: "",
                        user: "web_user_" + Date.now(),
                        inputs: {}
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // 移除思考中的消息
                const thinkingMsg = chatBox.querySelector('.loading');
                if (thinkingMsg && thinkingMsg.parentElement) {
                    thinkingMsg.parentElement.remove();
                }
                
                // 添加AI回复
                if (data.answer) {
                    addMessage(data.answer, 'ai');
                    updateStatus('响应成功');
                } else {
                    throw new Error('API返回格式不正确');
                }
                
            } catch (error) {
                console.error('API错误:', error);
                
                // 移除思考中的消息
                const thinkingMsg = chatBox.querySelector('.loading');
                if (thinkingMsg && thinkingMsg.parentElement) {
                    thinkingMsg.parentElement.remove();
                }
                
                // 显示错误信息
                addMessage(`抱歉，出错了: ${error.message}`, 'ai');
                updateStatus(`错误: ${error.message}`);
            }
        }
        
        // 处理用户发送消息
        async function handleSendMessage() {
            const message = userInput.value.trim();
            
            if (!message) {
                alert('请输入消息');
                return;
            }
            
            // 禁用按钮防止重复发送
            sendBtn.disabled = true;
            userInput.disabled = true;
            
            // 添加用户消息
            addMessage(message, 'user');
            
            // 清空输入框
            userInput.value = '';
            
            // 调用API
            updateStatus('正在发送请求...');
            await callDifyAPI(message);
            
            // 恢复按钮
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }
        
        // 事件监听
        sendBtn.addEventListener('click', handleSendMessage);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });
        
        // 页面加载完成
        window.onload = () => {
            userInput.focus();
            updateStatus('已连接到Dify API');
        };
    </script>
</body>
</html>
