<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东方快车探案 - AI对话与关系图</title>
    <!-- 引入ECharts -->
    <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 25px 30px;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            text-align: center;
            flex-shrink: 0;
        }
        
        .header h2 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 15px;
        }
        
        /* 主要内容区域 - 关系图在上，对话在下 */
        .main-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        
        /* 关系图区域 - 占60%高度 */
        .graph-section {
            flex: 3;  /* 改为flex比例控制，不是固定高度 */
            min-height: 300px; /* 最小高度保证显示 */
            position: relative;
            border-bottom: 2px solid #e0e0e0;
            background: #fafafa;
        }
        
        #graph-container {
            width: 100%;
            height: 100%;
        }
        
        /* 对话区域 - 占40%高度 */
        .chat-section {
            flex: 2;  /* 改为flex比例控制 */
            display: flex;
            flex-direction: column;
            min-height: 250px; /* 最小高度保证显示 */
        }
        
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: white;
        }
        
        .message {
            margin: 12px 0;
            padding: 14px 18px;
            border-radius: 10px;
            line-height: 1.6;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-msg {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.2);
        }
        
        .ai-msg {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            color: #1b5e20;
            border: 1px solid #a5d6a7;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.1);
        }
        
        .loading {
            display: inline-flex;
            align-items: center;
            color: #666;
            font-style: italic;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            background: #2196f3;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        .input-area {
            padding: 20px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        
        input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        
        input:focus {
            outline: none;
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }
        
        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        
        button:hover {
            background: linear-gradient(135deg, #1976d2, #1565c0);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status {
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: #666;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        /* 响应式调整 */
        @media (max-height: 800px) {
            .graph-section { flex: 2; }
            .chat-section { flex: 1; }
        }
        
        @media (max-height: 600px) {
            .graph-section { min-height: 200px; }
            .chat-section { min-height: 200px; }
            .header { padding: 15px; }
        }
        
        /* 图表图例样式 */
        .graph-legend {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            font-size: 12px;
            z-index: 10;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题区域 -->
        <div class="header">
            <h2>🚂 东方快车探案 - AI侦探对话系统</h2>
            <p>与波洛侦探对话，动态构建案件关系图</p>
        </div>
        
        <div class="main-content">
            <!-- 关系图区域（上部） -->
            <div class="graph-section">
                <div id="graph-container"></div>
                <div class="graph-legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e74c3c;"></div>
                        <span>人物</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #3498db;"></div>
                        <span>事件</span>
                    </div>
                </div>
            </div>
            
            <!-- 对话区域（下部） -->
            <div class="chat-section">
                <div id="chat-box" class="chat-box">
                    <div class="message ai-msg">
                        Ah, bonjour! 我是赫尔克里·波洛侦探，正在调查东方快车上的离奇命案。我的"灰色脑细胞"已经活跃起来了，你想了解什么，mon ami？
                    </div>
                </div>
                
                <div class="input-area">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="向波洛侦探提问（例如：案发现场是什么情况？）" 
                        autocomplete="off"
                    >
                    <button id="send-btn">发送</button>
                </div>
            </div>
        </div>
        
        <div id="status" class="status">
            就绪 - 等待输入
        </div>
    </div>

    <script>
        /* 配置部分 */
        const API_KEY = 'app-Yvdf9uBlW6VQChriK838JPcA';
        const API_URL = 'https://api.dify.ai/v1/chat-messages';
        
        /* DOM元素 */
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const status = document.getElementById('status');
        
        /* ECharts图表实例 */
        let myChart = null;
        
        /* 初始关系图数据 */
        let graphData = {
            categories: [
                { name: "人物" },
                { name: "事件" }
            ],
            nodes: [],
            links: []
        };
        
        /* 节点ID计数器 */
        let nodeIdCounter = 0;
        
        /* 初始化ECharts图表 */
        function initGraph() {
            const chartDom = document.getElementById('graph-container');
            myChart = echarts.init(chartDom);
            
            // 初始图表配置
            const option = {
                title: {
                    text: '案件关系图',
                    left: 'center',
                    top: 10,
                    textStyle: {
                        color: '#333',
                        fontSize: 18,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (params.dataType === 'node') {
                            return `<b>${params.data.name}</b><br/>类型: ${graphData.categories[params.data.category].name}`;
                        } else if (params.dataType === 'edge') {
                            const source = graphData.nodes.find(n => n.id === params.data.source);
                            const target = graphData.nodes.find(n => n.id === params.data.target);
                            return `<b>关系连接</b><br/>${source?.name} → ${target?.name}`;
                        }
                    }
                },
                legend: {
                    show: true,
                    top: 40,
                    data: graphData.categories.map(cat => cat.name),
                    textStyle: {
                        fontSize: 12
                    }
                },
                animationDuration: 1500,
                animationEasingUpdate: 'quinticInOut',
                series: [{
                    name: '案件关系',
                    type: 'graph',
                    layout: 'force',
                    data: graphData.nodes,
                    links: graphData.links,
                    categories: graphData.categories,
                    roam: true,
                    draggable: true,
                    label: {
                        show: true,
                        position: 'right',
                        formatter: '{b}',
                        fontSize: 12
                    },
                    lineStyle: {
                        color: 'source',
                        curveness: 0.1,
                        width: 2
                    },
                    emphasis: {
                        focus: 'adjacency',
                        lineStyle: {
                            width: 4
                        }
                    },
                    force: {
                        repulsion: 200,
                        edgeLength: 100,
                        gravity: 0.05,
                        layoutAnimation: true
                    }
                }]
            };
            
            myChart.setOption(option);
            
            // 窗口大小变化时重绘
            window.addEventListener('resize', function() {
                myChart.resize();
            });
        }
        
        /* 添加消息到聊天框 */
        function addMessage(text, type = 'ai') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            if (text === 'thinking') {
                msgDiv.innerHTML = `
                    <div class="loading">
                        波洛思考中<span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                `;
            } else {
                msgDiv.textContent = text;
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        /* 更新状态 */
        function updateStatus(text) {
            status.textContent = text;
        }
        
        /* 调用Dify API */
        async function callDifyAPI(userMessage) {
            try {
                // 显示思考中
                addMessage('thinking', 'ai');
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        query: userMessage,
                        response_mode: "blocking",
                        conversation_id: "",
                        user: "detective_game_" + Date.now(),
                        inputs: {}
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // 移除思考中的消息
                const thinkingMsg = chatBox.querySelector('.loading');
                if (thinkingMsg && thinkingMsg.parentElement) {
                    thinkingMsg.parentElement.remove();
                }
                
                if (data.answer) {
                    // 添加AI回复
                    addMessage(data.answer, 'ai');
                    updateStatus('响应成功');
                    
                    // 这里你会处理data.answer，分割出图表数据
                    // 然后调用 updateGraphWithData(parsedGraphData)
                    
                    return data.answer;
                } else {
                    throw new Error('API返回格式不正确');
                }
                
            } catch (error) {
                console.error('API错误:', error);
                
                // 移除思考中的消息
                const thinkingMsg = chatBox.querySelector('.loading');
                if (thinkingMsg && thinkingMsg.parentElement) {
                    thinkingMsg.parentElement.remove();
                }
                
                // 显示错误信息
                addMessage(`抱歉，出错了: ${error.message}`, 'ai');
                updateStatus(`错误: ${error.message}`);
                
                return null;
            }
        }
        
        /* 更新关系图数据的函数（你需要实现的） */
        function updateGraphWithData(newGraphData) {
            // 这里你会根据AI返回的图表数据更新graphData
            // 然后更新ECharts图表
            // myChart.setOption({
            //     series: [{
            //         data: graphData.nodes,
            //         links: graphData.links
            //     }]
            // });
            console.log('需要处理的新图表数据:', newGraphData);
        }
        
        /* 处理用户发送消息 */
        async function handleSendMessage() {
            const message = userInput.value.trim();
            
            if (!message) {
                alert('请输入问题');
                return;
            }
            
            // 禁用按钮防止重复发送
            sendBtn.disabled = true;
            userInput.disabled = true;
            
            // 添加用户消息
            addMessage(message, 'user');
            
            // 清空输入框
            userInput.value = '';
            
            // 调用API
            updateStatus('正在向波洛侦探提问...');
            const aiResponse = await callDifyAPI(message);
            
            if (aiResponse) {
                // 这里你会解析aiResponse，提取图表数据
                // 然后调用 updateGraphWithData()
            }
            
            // 恢复按钮
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }
        
        /* 事件监听 */
        sendBtn.addEventListener('click', handleSendMessage);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });
        
        /* 页面加载完成 */
        window.onload = () => {
            // 初始化图表
            initGraph();
            
            // 初始添加一个节点示例
            graphData.nodes.push({
                id: nodeIdCounter++,
                name: "雷切特",
                symbolSize: 25,
                category: 0
            });
            
            // 更新图表
            myChart.setOption({
                series: [{
                    data: graphData.nodes,
                    links: graphData.links
                }]
            });
            
            // 聚焦输入框
            userInput.focus();
            updateStatus('系统已就绪，可以开始探案对话');
        };
    </script>
</body>
</html>
